name: open-dep-ticket

# Manual recovery workflow: re-open the dependency-update ticket in both
# downstream consumer repos (Seretos/agent-project-issues and
# Seretos/workboard) when the automatic steps in release.yml were skipped
# or failed (e.g. missing token at release time).
#
# Design: independence + failure visibility.
#   - The semver validation step runs first with no continue-on-error; an
#     invalid version halts the job before any ticket is filed.
#   - Each consumer step carries continue-on-error: true so a broken token
#     for one consumer never prevents the other from attempting.
#   - A final "Report consumer failures" step (if: always()) inspects both
#     outcomes and exits non-zero if either failed, turning the job red and
#     naming exactly which token needs attention. This means the workflow
#     run summary will show a failure whenever ticket creation broke for
#     any consumer, while still guaranteeing both consumers always attempt.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "lib-python-projects version to reference (semver, no leading v) e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  file-tickets:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Validate version is semver
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "ERROR: version must be semver without a leading 'v' (e.g. 0.2.0), got: $VERSION"
            exit 1
          fi

      - name: Checkout
        # Local composite actions referenced below as ./.github/actions/...
        # can only resolve once the repo is checked out -- this must run
        # before the first `uses: ./.github/actions/...` step.
        uses: actions/checkout@v4

      - name: Open dependency-update ticket in agent-project-issues
        id: file_projects
        continue-on-error: true
        uses: ./.github/actions/file-consumer-ticket
        with:
          version: ${{ inputs.version }}
          source_repo: ${{ github.repository }}
          consumer_repo: Seretos/agent-project-issues
          # PROJECTS_TICKET_TOKEN must be a classic PAT with the `repo` scope
          # (Issues:write on the consumer repo) and the `project` scope, so
          # the board-add step below can reuse this same token — fine-grained
          # PATs have no Projects permission at all (no separate board secret).
          gh_token: ${{ secrets.PROJECTS_TICKET_TOKEN }}

      - name: Add agent-project-issues ticket to project board
        # Reuses PROJECTS_TICKET_TOKEN: a classic PAT carrying both `repo`
        # and `project` scopes, so no separate board secret is needed.
        id: board_projects
        if: steps.file_projects.outputs.issue_url != ''
        continue-on-error: true
        uses: ./.github/actions/add-to-board
        with:
          issue_url: ${{ steps.file_projects.outputs.issue_url }}
          board_owner: Seretos
          board_number: '2'
          gh_token: ${{ secrets.PROJECTS_TICKET_TOKEN }}

      - name: Open dependency-update ticket in workboard
        id: file_workboard
        continue-on-error: true
        uses: ./.github/actions/file-consumer-ticket
        with:
          version: ${{ inputs.version }}
          source_repo: ${{ github.repository }}
          consumer_repo: Seretos/workboard
          # WORKBOARD_TICKET_TOKEN must be a classic PAT with the `repo` scope
          # (Issues:write on the consumer repo) and the `project` scope, so
          # the board-add step below can reuse this same token — fine-grained
          # PATs have no Projects permission at all (no separate board secret).
          gh_token: ${{ secrets.WORKBOARD_TICKET_TOKEN }}

      - name: Add workboard ticket to project board
        # Reuses WORKBOARD_TICKET_TOKEN: a classic PAT carrying both `repo`
        # and `project` scopes, so no separate board secret is needed.
        id: board_workboard
        if: steps.file_workboard.outputs.issue_url != ''
        continue-on-error: true
        uses: ./.github/actions/add-to-board
        with:
          issue_url: ${{ steps.file_workboard.outputs.issue_url }}
          board_owner: Seretos
          board_number: '2'
          gh_token: ${{ secrets.WORKBOARD_TICKET_TOKEN }}

      - name: Report consumer failures
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.file_projects.outcome }}" = "failure" ]; then
            echo "::error::Filing in Seretos/agent-project-issues failed (check PROJECTS_TICKET_TOKEN)."
            failed=1
          fi
          if [ "${{ steps.file_workboard.outcome }}" = "failure" ]; then
            echo "::error::Filing in Seretos/workboard failed (check WORKBOARD_TICKET_TOKEN)."
            failed=1
          fi
          # Board failures never fail the job -- filing already succeeded,
          # and the ticket is still fully usable without a board placement.
          if [ "${{ steps.board_projects.outcome }}" = "failure" ]; then
            echo "::warning::Adding the agent-project-issues ticket to the project board failed (check PROJECTS_TICKET_TOKEN's project scope)."
          fi
          if [ "${{ steps.board_workboard.outcome }}" = "failure" ]; then
            echo "::warning::Adding the workboard ticket to the project board failed (check WORKBOARD_TICKET_TOKEN's project scope)."
          fi
          exit $failed
