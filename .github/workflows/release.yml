name: release

# Manual lib-release flow. Analogous to the plugin's release.yml but
# without the binary build (libs ship as Python source distributions
# pulled by downstream consumers via `git+https://.../@vX.Y.Z` or
# `@release/Nx`). Topology:
#
#   stamp+publish (ubuntu-22.04) -> validates semver, fails on
#                                   duplicate tag, stamps pyproject.toml
#                                   with the requested version on a
#                                   fresh release branch built off main,
#                                   tags the stamp commit as vX.Y.Z,
#                                   force-pushes release/Nx (the
#                                   floating branch downstream consumers
#                                   pin to), and creates the GitHub
#                                   Release. `main` is never touched —
#                                   the bot commit lives only on the
#                                   release/Nx branch.
#
# Release-branch policy:
#   release/0.x  — all 0.x.y releases.   Force-pushed each release.
#   release/1.x  — all 1.x.y releases.   Created the first time a 1.x.y
#                  release is published; force-pushed each release after.
#   release/Nx   — analogous.
#
# Past tags remain reachable via `git+https://.../@vX.Y.Z` even after
# a force-push because the commit they point to is preserved by git as
# long as the tag exists.
#
# Cross-lib note: this lib pins lib-python-config via @release/0.x
# (see pyproject.toml). A release here ships with whichever config
# commit sits on that branch at install time — bump config first if
# this release needs a specific config-side fix.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Validate version is semver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE])."
            exit 1
          fi

      - name: Check tag does not yet exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute release-branch name
        id: branch
        shell: bash
        run: |
          V="${{ inputs.version }}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          BRANCH="release/${MAJOR}.x"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Will publish to ${BRANCH}"

      - name: Stamp pyproject.toml, commit, tag, force-push release branch
        # Stamp via sed (POSIX, no extra tools), anchored to start of
        # line to avoid touching nested versions in tool tables. The
        # stamp commit lives only on the release/Nx branch — main
        # stays at whatever HEAD it was before this workflow ran.
        shell: bash
        run: |
          V="${{ inputs.version }}"
          TAG="v${V}"
          BRANCH="${{ steps.branch.outputs.name }}"

          sed -i -E 's/^(version[[:space:]]*=[[:space:]]*")[^"]*(")/\1'"$V"'\2/' pyproject.toml
          grep -E "^version[[:space:]]*=[[:space:]]*\"$V\"" pyproject.toml \
            || { echo "::error::pyproject.toml stamp failed"; exit 1; }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Build the release branch fresh from main HEAD each time.
          # Past tags pin past commits — they are independent of where
          # the release/Nx pointer currently sits.
          git checkout -B "$BRANCH"
          git add pyproject.toml
          git commit -m "release: ${TAG}"

          git tag -a "$TAG" -m "${TAG}"

          git push origin "$BRANCH" --force
          git push origin "$TAG"

      - name: Compute previous release tag
        # Feeds "Create GitHub Release" below: the greatest v* tag strictly
        # below this release's version, so --generate-notes only covers the
        # delta since the previous release instead of every commit back to
        # this repo's very first one (#251). Never fails the release itself
        # -- ci.prev_tag.run degrades to an empty previous_tag (a warning,
        # not an error) on any gh lookup failure or on a first release.
        id: prev_tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m ci.prev_tag

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          PREV_TAG: ${{ steps.prev_tag.outputs.previous_tag }}
        run: |
          TAG="v$VERSION"
          PRE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRE_FLAG="--prerelease"
          fi
          NOTES_START_TAG_FLAG=()
          if [[ -n "$PREV_TAG" ]]; then
            NOTES_START_TAG_FLAG=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            "${NOTES_START_TAG_FLAG[@]}" \
            $PRE_FLAG

      - name: Open dependency-update ticket in consumers
        # continue-on-error: a missing/invalid PROJECTS_TICKET_TOKEN must
        # never fail the release itself.
        id: file_projects
        continue-on-error: true
        uses: ./.github/actions/file-consumer-ticket
        with:
          version: ${{ inputs.version }}
          source_repo: ${{ github.repository }}
          consumer_repo: Seretos/agent-project-issues
          # PROJECTS_TICKET_TOKEN must be a classic PAT with the `repo` scope
          # (Issues:write on the consumer repo) and the `project` scope, so
          # the board-add step below can reuse this same token — fine-grained
          # PATs have no Projects permission at all (no separate board secret).
          gh_token: ${{ secrets.PROJECTS_TICKET_TOKEN }}

      - name: Add agent-project-issues ticket to project board
        # Reuses PROJECTS_TICKET_TOKEN: a classic PAT carrying both `repo`
        # (Issues:write on the consumer repo) and `project` scopes, so the
        # same per-consumer token adds the item to the user-owned Projects v2
        # board — no separate board secret to maintain.
        id: board_projects
        if: steps.file_projects.outputs.issue_url != ''
        continue-on-error: true
        uses: ./.github/actions/add-to-board
        with:
          issue_url: ${{ steps.file_projects.outputs.issue_url }}
          board_owner: Seretos
          board_number: '2'
          gh_token: ${{ secrets.PROJECTS_TICKET_TOKEN }}

      - name: Open dependency-update ticket in workboard
        # continue-on-error: a missing/invalid WORKBOARD_TICKET_TOKEN must
        # never fail the release itself.
        id: file_workboard
        continue-on-error: true
        uses: ./.github/actions/file-consumer-ticket
        with:
          version: ${{ inputs.version }}
          source_repo: ${{ github.repository }}
          consumer_repo: Seretos/workboard
          # WORKBOARD_TICKET_TOKEN must be a classic PAT with the `repo` scope
          # (Issues:write on the consumer repo) and the `project` scope, so
          # the board-add step below can reuse this same token — fine-grained
          # PATs have no Projects permission at all (no separate board secret).
          gh_token: ${{ secrets.WORKBOARD_TICKET_TOKEN }}

      - name: Add workboard ticket to project board
        # Reuses WORKBOARD_TICKET_TOKEN: a classic PAT carrying both `repo`
        # and `project` scopes, so no separate board secret is needed.
        id: board_workboard
        if: steps.file_workboard.outputs.issue_url != ''
        continue-on-error: true
        uses: ./.github/actions/add-to-board
        with:
          issue_url: ${{ steps.file_workboard.outputs.issue_url }}
          board_owner: Seretos
          board_number: '2'
          gh_token: ${{ secrets.WORKBOARD_TICKET_TOKEN }}
